<svg xmlns="http://www.w3.org/2000/svg" width="920" height="772" viewBox="0 0 920 772"><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#28282d}.title{font-size:24px;font-weight:700}.small{font-size:16px;fill:#66636a}.label{font-size:19px;font-weight:600}</style><rect width="100%" height="100%" fill="#fffdf9"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#8f1d2c"/></marker></defs><text x="34" y="43" class="title">电子琴的五步调试流程</text><circle cx="56" cy="129" r="22" fill="#8f1d2c"/><text x="50" y="136" class="label" style="fill:#fff">1</text><rect x="99" y="78" width="778" height="108" rx="12" fill="#fff" stroke="#d8c3bc"/><text x="122" y="109" class="label">梳理整体流程</text><text x="122" y="140" class="small">固定模式、参数与操作顺序</text><text x="122" y="165" class="small">沿输入、状态、计算和输出确定观察位置</text><path d="M488,189 L488,207" fill="none" stroke="#8f1d2c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="56" cy="264" r="22" fill="#8f1d2c"/><text x="50" y="271" class="label" style="fill:#fff">2</text><rect x="99" y="213" width="778" height="108" rx="12" fill="#fff" stroke="#d8c3bc"/><text x="122" y="244" class="label">排除基础配置问题</text><text x="122" y="275" class="small">检查工程路径、接线、时钟、GPIO 与中断</text><text x="122" y="300" class="small">从电平变化开始，再看中断映射和使能</text><path d="M488,324 L488,342" fill="none" stroke="#8f1d2c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="56" cy="399" r="22" fill="#8f1d2c"/><text x="50" y="406" class="label" style="fill:#fff">3</text><rect x="99" y="348" width="778" height="108" rx="12" fill="#fff" stroke="#d8c3bc"/><text x="122" y="379" class="label">分层隔离测试</text><text x="122" y="410" class="small">直接传入有效频率与占空比，单独测试声音输出</text><text x="122" y="435" class="small">根据结果转向驱动和硬件，或回查输入与计算</text><path d="M488,459 L488,477" fill="none" stroke="#8f1d2c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="56" cy="534" r="22" fill="#8f1d2c"/><text x="50" y="541" class="label" style="fill:#fff">4</text><rect x="99" y="483" width="778" height="108" rx="12" fill="#fff" stroke="#d8c3bc"/><text x="122" y="514" class="label">检查内部逻辑与模块接口</text><text x="122" y="545" class="small">核对倍率、事件索引、共享变量和调用顺序</text><text x="122" y="570" class="small">一次只改变相关条件，恢复连续运行检查时序</text><path d="M488,594 L488,612" fill="none" stroke="#8f1d2c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="56" cy="669" r="22" fill="#8f1d2c"/><text x="50" y="676" class="label" style="fill:#fff">5</text><rect x="99" y="618" width="778" height="108" rx="12" fill="#fff" stroke="#d8c3bc"/><text x="122" y="649" class="label">回归整体验证</text><text x="122" y="680" class="small">重复原异常操作，再检查模式切换和完整演奏</text><text x="122" y="705" class="small">记录现象、假设、验证结果与修改原因</text></svg>