<svg xmlns="http://www.w3.org/2000/svg" width="970" height="580" viewBox="0 0 970 580"><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#28282d}.title{font-size:24px;font-weight:700}.small{font-size:16px;fill:#66636a}.label{font-size:19px;font-weight:600}</style><rect width="100%" height="100%" fill="#fffdf9"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#8f1d2c"/></marker></defs><text x="34" y="43" class="title">有限的按键，清楚的操作语境</text><text x="34" y="76" class="small">mode 区分设置模式，isPlaying 区分待机与演奏</text><rect x="75" y="145" width="340" height="110" rx="12" fill="#fff" stroke="#d8c3bc"/><text x="93" y="179" class="label">音色设置 · mode = 1</text><text x="93" y="210" class="small">Voice / Transp / Shift</text><rect x="555" y="145" width="340" height="110" rx="12" fill="#fff" stroke="#d8c3bc"/><text x="573" y="179" class="label">伴奏设置 · mode = 2</text><text x="573" y="210" class="small">Style / Tempo / ArpVoc</text><rect x="315" y="375" width="340" height="110" rx="12" fill="#fff" stroke="#d8c3bc"/><text x="333" y="409" class="label">伴奏播放 · isPlaying = 1</text><text x="333" y="440" class="small">和弦 / 加花 / 速度 / 琴键演奏</text><path d="M420,170 L549,170" fill="none" stroke="#8f1d2c" stroke-width="2" marker-end="url(#arrow)"/><text x="437" y="151" class="small">摇杆按压</text><path d="M550,233 L422,233" fill="none" stroke="#8f1d2c" stroke-width="2" marker-end="url(#arrow)"/><text x="437" y="218" class="small">摇杆按压</text><path d="M760,262 L760,430 L662,430" fill="none" stroke="#8f1d2c" stroke-width="2" marker-end="url(#arrow)"/><text x="775" y="326" class="small">左功能键</text><text x="775" y="351" class="small">启动伴奏</text><path d="M485,370 L485,290 L615,290 L615,262" fill="none" stroke="#8f1d2c" stroke-width="2" marker-end="url(#arrow)"/><text x="332" y="328" class="small">编码器按键</text><text x="332" y="353" class="small">尾声与收尾</text><text x="75" y="548" class="small">切换设置模式时 knob 回到 1；伴奏结束后 isPlaying 回到 0。</text></svg>